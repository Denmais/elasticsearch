services:
  postgres:
    image: postgres:16-alpine
    container_name: async-jobs-postgres
    environment:
      POSTGRES_DB: async_jobs
      POSTGRES_USER: async_user
      POSTGRES_PASSWORD: async_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U async_user -d async_jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: async-jobs-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  app:
    build: .
    image: async-jobs-app:local
    environment:
      POSTGRES: postgresql+asyncpg://async_user:async_password@postgres:5432/async_jobs
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: documents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  test:
    image: async-jobs-app:local
    profiles: ["test"]
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_started
    command: ["pytest", "-q", "test_documents.py"]

volumes:
  postgres_data:
  elastic_data: